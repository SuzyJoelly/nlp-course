[project]
name = "nlp-course"
version = "2026.10"
description = "Natural Language Processing & LLMs course: labs, assignments and capstone material"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Core scientific stack
    "numpy>=1.26,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy>=2.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "pandas>=2.2",
    "pyarrow>=15,<23; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "pyarrow>=15; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.4",
    "requests>=2.31",
    "tqdm>=4.66",
    # Classical NLP
    "nltk>=3.9",
    "spacy>=3.8",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "wordcloud>=1.9",
    "pillow>=10,<12; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "pillow>=10; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "gensim>=4.3",
    # Deep learning & Hugging Face
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "transformers>=4.44",
    "sentence-transformers>=3.0",
    "datasets>=3.0",
    "huggingface-hub>=0.34,<1.0",
    "fsspec>=2024.6",
    "aiohttp>=3.9",
    # Notebooks & apps
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "gradio>=4.44",
]

[dependency-groups]
# Tools used by the teacher only (grading, notebook generation)
teacher = [
    "openpyxl>=3.1",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "nbconvert>=7.16",
    "papermill>=2.6",
]

[tool.uv]
package = false
default-groups = []

# On Linux (Codespaces, servers) PyPI ships PyTorch with the CUDA libraries (about 3 GB).
# The CPU build is enough for the labs. Windows and macOS wheels on PyPI are already CPU builds.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
